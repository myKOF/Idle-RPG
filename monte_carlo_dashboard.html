<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>放置型 RPG 蒙地卡羅模擬與數值平衡儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .title-group h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
        }
        .title-group p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        select, input {
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .card-val {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 5px;
        }
        .chart-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
            height: 520px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-group">
            <h1>📊 放置型 RPG 蒙地卡羅數值模擬儀表板</h1>
            <p>Monte Carlo Simulation Balance Analysis Engine</p>
        </div>
        <div id="config-badge" style="color: var(--text-muted); font-size: 14px;"></div>
    </div>

    <!-- 軸維度選擇控制面板 -->
    <div class="controls-grid">
        <div class="control-item">
            <label for="xAxisSelect">📌 X 軸維度 (X-Axis)</label>
            <select id="xAxisSelect" onchange="updateChart()">
                <option value="hour">⏱️ 遊玩時間 (小時 Hours)</option>
                <option value="stage">🚩 到達關卡數 (Stage Progress)</option>
            </select>
        </div>
        <div class="control-item">
            <label for="yAxisSelect">📈 Y 軸指標維度 (Y-Axis Metric)</label>
            <select id="yAxisSelect" onchange="updateChart()">
                <option value="dps">⚔️ 玩家 DPS (每秒輸出傷害)</option>
                <option value="stage">🚩 到達關卡數 (Stage Cleared)</option>
                <option value="level">📈 玩家等級 (Player Level)</option>
                <option value="equip_score">🛡️ 裝備綜合分數 (Equipment Quality Score)</option>
                <option value="total_skills">🔮 技能總等級 (Total Skill Levels)</option>
                <option value="enhancements">🔨 裝備強化總次數 (Total Enhancements)</option>
                <option value="gem_syntheses">💎 寶石合成總次數 (Gem Syntheses)</option>
                <option value="gold_spent">🪙 消耗金幣總數 (Total Gold Spent)</option>
                <option value="stones_spent">🪨 消耗強化石總數 (Upgrade Stones Spent)</option>
                <option value="gems_spent">💠 消耗寶石總數 (Gems Spent)</option>
            </select>
        </div>
        <div class="control-item">
            <label for="statTypeSelect">📊 統計數據顯示 (Metric Aggregate)</label>
            <select id="statTypeSelect" onchange="updateChart()">
                <option value="mean">均值 (Mean) + P10/P90 信心區間</option>
                <option value="median">中位數 (Median)</option>
            </select>
        </div>
    </div>

    <!-- 關鍵指標卡片 -->
    <div class="stats-cards">
        <div class="card">
            <label>模擬總次數</label>
            <div class="card-val" id="card-runs">-</div>
        </div>
        <div class="card">
            <label>最終平均 DPS</label>
            <div class="card-val" id="card-dps">-</div>
        </div>
        <div class="card">
            <label>最終平均關卡</label>
            <div class="card-val" id="card-stage">-</div>
        </div>
        <div class="card">
            <label>平均強化次數</label>
            <div class="card-val" id="card-enhancements">-</div>
        </div>
        <div class="card">
            <label>平均寶石合成次數</label>
            <div class="card-val" id="card-gems">-</div>
        </div>
    </div>

    <!-- 圖表渲染區塊 -->
    <div class="chart-container">
        <canvas id="mcChart"></canvas>
    </div>

            document.getElementById('config-badge').innerText = 
                `遊玩次數: ${cfg.runs} | 肝度: ${cfg.activity} | 策略: ${cfg.strategy} | 模擬時間: ${cfg.total_hours}小時`;

            const lastStep = simData.time_series[simData.time_series.length - 1];
            document.getElementById('card-runs').innerText = cfg.runs;
            document.getElementById('card-dps').innerText = Math.round(lastStep.dps.mean).toLocaleString();
            document.getElementById('card-stage').innerText = Math.round(lastStep.stage.mean);
            document.getElementById('card-enhancements').innerText = Math.round(lastStep.enhancements.mean);
            document.getElementById('card-gems').innerText = Math.round(lastStep.gem_syntheses.mean);

            updateChart();
        }

        function updateChart() {
            const xKey = document.getElementById('xAxisSelect').value;
            const yKey = document.getElementById('yAxisSelect').value;
            const statType = document.getElementById('statTypeSelect').value;

            const timeSeries = simData.time_series;
            
            let xLabels = [];
            if (xKey === 'hour') {
                xLabels = timeSeries.map(s => s.hour + ' 小時');
            } else {
                xLabels = timeSeries.map(s => '關卡 ' + Math.round(s.stage.mean));
            }

            const yDataMean = timeSeries.map(s => s[yKey] ? s[yKey][statType] : 0);
            const yDataP10 = timeSeries.map(s => s[yKey] ? s[yKey].p10 : 0);
            const yDataP90 = timeSeries.map(s => s[yKey] ? s[yKey].p90 : 0);

            const ctx = document.getElementById('mcChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            const metricLabels = {
                dps: '⚔️ DPS (每秒輸出)',
                stage: '🚩 到達關卡數',
                level: '📈 玩家等級',
                equip_score: '🛡️ 裝備綜合分數',
                total_skills: '🔮 技能總等級',
                enhancements: '🔨 裝備強化總次數',
                gem_syntheses: '💎 寶石合成總次數',
                gold_spent: '🪙 消耗金幣總數',
                stones_spent: '🪨 消耗強化石總數',
                gems_spent: '💠 消耗寶石總數'
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xLabels,
                    datasets: [
                        {
                            label: metricLabels[yKey] + ' (' + (statType === 'mean' ? '平均值' : '中位數') + ')',
                            data: yDataMean,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            borderWidth: 3,
                            tension: 0.2,
                            fill: false
                        },
                        {
                            label: 'P90 (90% 上界上限)',
                            data: yDataP90,
                            borderColor: 'rgba(52, 211, 153, 0.4)',
                            borderDash: [5, 5],
                            borderWidth: 1.5,
                            pointRadius: 0,
                            fill: false
                        },
                        {
                            label: 'P10 (10% 下界下限)',
                            data: yDataP10,
                            borderColor: 'rgba(248, 113, 113, 0.4)',
                            borderDash: [5, 5],
                            borderWidth: 1.5,
                            pointRadius: 0,
                            fill: '-1',
                            backgroundColor: 'rgba(56, 189, 248, 0.05)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc', font: { size: 13 } }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    }
                }
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
