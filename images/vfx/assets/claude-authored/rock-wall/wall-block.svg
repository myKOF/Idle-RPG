<svg xmlns="http://www.w3.org/2000/svg" width="256" height="200" viewBox="0 0 256 200">
  <!-- 築牆用的一塊岩壁：寬而粗糙的風化岩塊（稜角分明的受光面／背光面、裂紋、腳下碎石），
       配色與畫法對齊遊戲裡的岩石（rock-pyramid 那一類：土灰色、淡色高光、深褐細邊）。原創繪製，沒有參考外部圖片。 -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2=".6">
      <stop stop-color="#cfc7b2"/><stop offset=".5" stop-color="#a39b84"/><stop offset="1" stop-color="#625c4b"/>
    </linearGradient>
    <linearGradient id="shade" x2="1" y2="1">
      <stop stop-color="#8a836d"/><stop offset="1" stop-color="#4f4b3d"/>
    </linearGradient>
    <path id="main" d="M6 188 2 150 14 118 10 88 26 62 44 70 58 40 84 30 100 46 122 22 150 18 168 38 190 30 214 48 222 74 246 86 252 122 244 150 254 184 226 196 170 192 120 198 64 194Z"/>
    <clipPath id="body"><use href="#main"/></clipPath>
  </defs>
  <!-- 腳下陰影 -->
  <ellipse cx="128" cy="194" rx="126" ry="8" fill="#17140d" opacity=".5"/>
  <!-- 岩塊本體 -->
  <use href="#main" fill="url(#stone)" stroke="#5b5646" stroke-width="2.5" stroke-linejoin="round"/>
  <g clip-path="url(#body)">
    <!-- 受光面（左上）：大塊的淺色破裂面 -->
    <path d="M14 118 26 62 58 40 84 30 74 76 48 112Z" fill="#dcd4bf"/>
    <path d="M84 30 122 22 112 70 74 76Z" fill="#cdc4ad"/>
    <path d="M122 22 150 18 168 38 150 80 112 70Z" fill="#bfb69f"/>
    <path d="M2 150 14 118 48 112 60 160 30 184Z" fill="#b8b09a"/>
    <path d="M48 112 74 76 112 70 126 128 96 170 60 160Z" fill="#a9a18b"/>
    <!-- 背光面（右下）：深色面 -->
    <path d="M168 38 190 30 214 48 222 74 190 96 150 80Z" fill="#938b75"/>
    <path d="M222 74 246 86 252 122 244 150 210 130 190 96Z" fill="#6f6955"/>
    <path d="M112 70 150 80 190 96 186 150 140 176 126 128Z" fill="#8c846e"/>
    <path d="M190 96 210 130 244 150 254 184 226 196 186 150Z" fill="#625d4b"/>
    <path d="M60 160 96 170 140 176 186 150 226 196 170 192 120 198 64 194 30 184Z" fill="url(#shade)"/>
    <!-- 面與面之間的淺色稜線 -->
    <g fill="none" stroke="#efe6cc" stroke-linecap="round" stroke-linejoin="round" opacity=".65">
      <path d="M26 62 58 40 84 30 122 22 150 18 168 38" stroke-width="3"/>
      <path d="M14 118 26 62" stroke-width="2.4"/><path d="M74 76 112 70 150 80" stroke-width="2"/>
      <path d="M48 112 74 76" stroke-width="2"/>
    </g>
    <!-- 裂紋 -->
    <g fill="none" stroke="#4a4639" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 40 66 62 56 88 64 112 54 140 62 160" stroke-width="3.2"/>
      <path d="M112 70 120 98 110 124 126 128 118 152 128 176" stroke-width="3.4"/>
      <path d="M150 80 158 106 148 128 160 148 154 172" stroke-width="3"/>
      <path d="M190 96 196 118 188 136 200 156" stroke-width="2.8"/>
      <path d="M28 150 40 156 54 150 M96 170 108 160 120 164 M170 120 182 124 190 118" stroke-width="2.2"/>
      <path d="M214 48 210 66 220 80 M84 30 90 50 80 66" stroke-width="2"/>
    </g>
    <!-- 小碎片與缺角 -->
    <g fill="#e4dac0" opacity=".5">
      <path d="M40 82 46 78 49 86 42 90Z M98 94 104 90 107 98 100 102Z M176 60 182 56 185 64 178 68Z M20 138 25 134 28 141 22 144Z"/>
    </g>
    <g fill="#5c5746" opacity=".55">
      <path d="M70 120 76 116 79 124 72 128Z M132 144 138 140 141 148 134 152Z M206 112 212 108 215 116 208 120Z M160 176 166 172 170 180 162 184Z"/>
    </g>
  </g>
  <!-- 腳下碎石 -->
  <path d="M4 190 12 172 28 168 36 184 30 198 10 198Z" fill="#8c846e" stroke="#5b5646" stroke-width="2"/>
  <path d="M4 190 12 172 20 190 10 198Z" fill="#bdb49b"/>
  <path d="M226 192 232 174 246 170 254 184 250 198 234 199Z" fill="#7e7762" stroke="#5b5646" stroke-width="2"/>
  <path d="M226 192 232 174 240 192 234 199Z" fill="#b2a98f"/>
</svg>
