    <div id="loading-screen-label" class="loading-screen-label">Loading.</div>
  </div>
  <script>
    (function () {
      var timer = 0;
      var dots = 1;
      function updateLoadingText() {
        var label = document.getElementById('loading-screen-label');
        if (label) label.textContent = 'Loading' + '.'.repeat(dots);
        dots = dots >= 3 ? 1 : dots + 1;
      }
      window.showLoadingScreen = function () {
        var screen = document.getElementById('loading-screen');
        if (!screen) return;
        screen.classList.remove('is-hidden');
        screen.setAttribute('aria-hidden', 'false');
        clearInterval(timer);
        dots = 1;
        updateLoadingText();
        timer = setInterval(updateLoadingText, 350);
      };
      window.hideLoadingScreen = function () {
        clearInterval(timer);
        var screen = document.getElementById('loading-screen');
        if (!screen) return;
        screen.classList.add('is-hidden');
        screen.setAttribute('aria-hidden', 'true');
      };
      window.showLoadingScreen();
    })();
  </script>

  <!-- 戰鬥效能診斷（FPS 計數器下方的多行疊層、perfReport()）。只在內部版本才做事，
       正式遊玩是空殼。必須排在 ui.js（用它的 isInternalVersion）之後、VFX Runtime 建立（main 開機）之前。 -->
  <script src="js/battle-perf.js?v=1.0.3"></script>
  <!-- 模擬 Worker 的協議與橋接。bridge.js 於 DOMContentLoaded 開機 -->
  <script src="js/worker/protocol.js?v=62"></script>
  <script src="js/storage.js?v=1.0.1"></script>
  <script src="js/save_origin.js"></script>
  <!-- 多分頁鎖必須早於 bridge 與 main：那兩支的開機工作改由它決定何時執行 -->
  <script src="js/tablock.js"></script>
  <script src="js/bridge.js?v=1.0.374"></script>
  <!-- 真人操作錄製器。必須排在 bridge 之後（它要訂閱 WorkerBridge 的訊息），
       且排在 main 之前（開機在 TabLock 授權後才發生，錄製器得先掛上）。
       只在本機 ?record=1 時才做事，正式遊玩是一個空殼。 -->
  <script src="js/recorder.js"></script>
  <!-- 卡頓探針。與錄製器同樣是「只在本機／內網加了旗標才做事」的空殼，
       正式遊玩不包裝任何函式、不攔任何屬性。排在 main 之前，才來得及在
       DOMContentLoaded 就把 ui.js 的渲染函式包起來。用法：網址加 ?lag=1 -->
  <script src="js/lagprobe.js?v=1.0.18"></script>
  <script src="js/game-menu.js?v=1.0.3"></script>
  <script src="js/ai-key-setting.js?v=1.0.1"></script>
  <script src="js/main.js?v=1.0.4"></script>
</body>
