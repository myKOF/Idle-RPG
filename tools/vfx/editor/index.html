<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>VFX Editor MVP</title>
<link rel="stylesheet" href="/tools/vfx/editor/editor.css">
</head>
<body>
<header id="topbar">
  <strong>VFX Editor</strong>
  <span class="sep"></span>
  <!-- 播放與暫停是同一顆按鈕的兩個狀態，不是兩個動作：兩顆並排的話，
       畫面正在動還是停著要靠「哪一顆看起來被按下去」去猜。 -->
  <button id="btn-playpause" class="playpause">⏸ 暫停</button>
  <button id="btn-restart">⟲ Restart</button>
  <!-- 預覽循環：只影響編輯時的預覽，不是 preset.loop（那是會出貨的資料，
       在右邊 Inspector 的「Preset」區塊編輯）。混在一起的話，
       想重複看一次爆點就會把它改成永遠不結束的特效。 -->
  <label title="播完自動重播，只影響預覽，不會寫進 Preset"><input type="checkbox" id="chk-preview-loop" checked> 預覽循環</label>
  <span class="sep"></span>
  <button id="btn-undo" disabled>↶ 復原</button>
  <button id="btn-redo" disabled>↷ 重做</button>
  <span class="sep"></span>
  <!-- Preset 切換：搜尋框 ＋ 清單，不是原生 <select>。
       157 份 preset 用原生下拉一個一個捲已經找不到東西了，而原生下拉沒有辦法
       在打開的狀態下篩選。關鍵字同時比對 id 與用途標籤，所以打「雷球」也找得到
       lightning-orb-field。 -->
  <div id="preset-combo" class="combo">
    <!-- type=search 不只是語意：onKeyDown 用它判斷「這裡的 Ctrl+Z 該給瀏覽器」。
         打錯關鍵字想復原時，不該把整份 preset 回滾一步。 -->
    <input id="preset-search" class="combo-input" type="search" autocomplete="off"
           spellcheck="false" placeholder="搜尋特效…（id 或技能名）"
           title="打關鍵字篩選；↑↓ 選擇、Enter 開啟、Esc 取消">
    <button id="preset-toggle" class="combo-arrow" type="button" tabindex="-1"
            title="展開全部">▾</button>
    <div id="preset-list" class="combo-list" hidden></div>
  </div>
  <!-- <select> 的文字在任何瀏覽器裡都框不起來，所以「把這份特效的名稱複製走」
       只能靠一顆按鈕。用途是貼進文件、prompt 或檔名。 -->
  <button id="btn-copy-preset" class="copy-btn" title="複製目前的 Preset 名稱到剪貼簿">⧉ 複製</button>
  <button id="btn-load">載入 Preset</button>
  <button id="btn-save" title="儲存到 repo（Ctrl+S）">儲存到 repo</button>
  <button id="btn-download">下載複本</button>
  <input type="file" id="file-load" accept="application/json" hidden>
  <span id="dirty-flag" class="dirty"></span>
  <span id="save-status" class="save-status"></span>
  <span class="sep"></span>
  <!-- Spine 參考：只看不改。runtime 是按下去才載的，見 spine-ref.js -->
  <button id="spine-open" title="播放 Spine 特效當作重做時的參考（唯讀）">🦴 Spine 參考</button>
  <span class="sep"></span>
  <span id="stats" class="stats"></span>
  <span class="sep"></span>
  <!-- 關閉編輯器＝連伺服器一起停。存在的理由是那個 console 視窗會不見
       （關掉時 node 不一定跟著死），行程卻還活著佔著埠，啟動器每次掃到它
       就沿用，於是永遠等不到那個「要你關掉」的視窗。 -->
  <button id="btn-quit" class="quit-btn" title="關閉編輯器並停止伺服器">⏻ 關閉編輯器</button>
</header>

<main id="layout">
  <aside id="left">
    <section id="asset-browser">
      <h2>Asset Browser</h2>
      <div class="filters">
        <input type="search" id="f-text" placeholder="搜尋 assetId…">
        <select id="f-usage"><option value="">usage（全部）</option></select>
        <select id="f-shape"><option value="">shape（全部）</option></select>
        <select id="f-element"><option value="">element（全部）</option></select>
        <select id="f-tag"><option value="">tag（全部）</option></select>
        <!-- 背景底色來自事實層（asset-index 的 backgroundVariant），不是語意判斷。
             挑素材時它決定該配哪一種混色，選錯會在畫面上疊出黑方塊或整片死白。 -->
        <select id="f-background"><option value="">背景（全部）</option></select>
        <label class="inline"><input type="checkbox" id="f-high"> 只看高信心</label>
      </div>
      <div id="asset-count" class="hint"></div>
      <div id="asset-list"></div>
    </section>
    <section id="layer-panel">
      <h2>Layers</h2>
      <div class="row">
        <select id="new-layer-type">
          <option value="sprite">sprite</option>
          <option value="particle">particle</option>
          <option value="procedural">procedural</option>
        </select>
        <button id="btn-add-layer">＋ 新增</button>
        <button id="btn-del-layer">刪除</button>
      </div>
      <div class="row">
        <button id="btn-group" title="把選取的圖層組成一個群組">組成群組</button>
        <button id="btn-ungroup" title="解散選取的群組（圖層本身不會被刪）">解散</button>
        <!-- 顯示排序。它只改「畫面上怎麼排」，不動 preset.layers，也不動 zIndex。 -->
        <select id="sel-sort" title="只影響顯示順序，不改變資料與繪製順序">
          <option value="creation">建立順序</option>
          <option value="name">名稱 A→Z</option>
        </select>
      </div>
      <div class="row layer-hint">
        <span id="layer-status"></span>
        <span id="clipboard-status"></span>
      </div>
      <div id="layer-list"></div>
    </section>
  </aside>

  <section id="center">
    <!-- 背景色列：緊貼預覽區上方。特效是否「在這個場景裡看得清楚」
         只有換背景才判斷得出來，所以控制項要離畫面近、一下就能點。 -->
    <div id="bg-bar">
      <span class="bg-label">背景</span>
      <div id="bg-swatches"></div>
      <label class="bg-custom" title="自訂背景色">
        <input type="color" id="bg-picker" value="#101014">
        <span>自訂</span>
      </label>
      <span id="bg-current" class="bg-current"></span>
      <span class="sep"></span>
      <!-- 格線與縮放同屬「怎麼看」，所以跟背景色放同一列，離預覽區最近。 -->
      <label class="bg-toggle" title="淺色座標格線；1 大格 = 6 米，與遊戲同比例">
        <input type="checkbox" id="chk-grid" checked><span>格線</span>
      </label>
      <button id="zoom-reset" class="zoom-reset"
              title="在預覽區用滾輪縮放；按中鍵或點這裡回到 100%">縮放 100%</button>
      <span id="grid-scale" class="scale-note"></span>
    </div>
    <div id="preview-host"></div>
    <div id="preview-msg" class="hint"></div>
  </section>

  <aside id="right">
    <h2>Inspector</h2>
    <div id="inspector"></div>
    <h2>驗證</h2>
    <div id="validation" class="hint"></div>
  </aside>
</main>

<!-- Asset Picker：從 Asset Library Index 選 assetId。
     刻意不用作業系統的檔案選擇器——那會選到 D:\... 之類的絕對路徑，
     一存進 Preset 就失去可移植性，換台電腦就壞。 -->
<div id="picker" hidden>
  <div class="picker-box">
    <header class="picker-head">
      <strong>選擇素材</strong>
      <span id="picker-target" class="picker-target"></span>
      <span class="sep"></span>
      <input type="search" id="pf-text" placeholder="搜尋 assetId…">
      <select id="pf-usage"></select>
      <select id="pf-shape"></select>
      <select id="pf-element"></select>
      <select id="pf-tag"></select>
      <select id="pf-background"></select>
      <label class="inline"><input type="checkbox" id="pf-high"> 只看高信心</label>
      <span id="picker-count" class="hint"></span>
      <button id="picker-close" title="Esc">✕</button>
    </header>
    <div class="picker-body">
      <div id="picker-list"></div>
      <aside id="picker-detail">
        <div id="picker-preview"></div>
        <div id="picker-meta"></div>
      </aside>
    </div>
    <footer class="picker-foot">
      <span class="hint">單擊預覽　雙擊套用　Esc 取消</span>
      <button id="picker-apply" disabled>套用到目前圖層</button>
    </footer>
  </div>
</div>

<!-- Spine 參考面板：把買來的 Spine 特效播出來看，作為自己用 preset 重做的參照。
     刻意沒有任何編輯功能——它不是第二套特效系統，是一張會動的參考圖。
     Spine runtime 不在下面的 script 清單裡，是這個面板按下按鈕才動態載入的，
     所以它不會隨遊戲出貨（授權上那是兩件不同的事）。 -->
<div id="spine-ref" hidden>
  <div class="spine-box">
    <header class="picker-head">
      <strong>Spine 參考</strong>
      <span class="picker-target">唯讀，不會動到目前的 Preset</span>
      <span class="sep"></span>
      <span id="spine-status" class="spine-status"></span>
      <button id="spine-close" title="Esc">✕</button>
    </header>
    <div class="spine-body">
      <aside class="spine-side">
        <div id="spine-drop">
          選整個資料夾<br><span class="hint">骨架 ＋ atlas ＋ 圖集頁要在同一層</span>
          <input id="spine-pick" type="file" webkitdirectory multiple hidden>
        </div>
        <h3>骨架</h3>
        <div id="spine-list" class="spine-listbox"></div>
        <h3>動畫</h3>
        <div id="spine-anims" class="spine-listbox"></div>
      </aside>
      <div class="spine-main">
        <div id="spine-host"></div>
        <div class="spine-ctl">
          <label><input type="checkbox" id="spine-loop" checked> 循環</label>
          <label>速度
            <select id="spine-speed">
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
            </select>
          </label>
          <label>縮放 <span id="spine-scale-val">1.00</span>
            <input id="spine-scale" type="range" min="0.05" max="4" step="0.05" value="1">
          </label>
          <span class="sep"></span>
          <label>逐格
            <select id="spine-frames"><option>8</option><option selected>12</option><option>16</option><option>24</option></select>
          </label>
          <label>每格
            <select id="spine-cell"><option>96</option><option selected>128</option><option>192</option><option>256</option></select>
          </label>
          <button id="spine-strip" title="把這一段動畫攤成逐格圖存下來">存逐格圖</button>
        </div>
        <div id="spine-info" class="hint"></div>
      </div>
    </div>
  </div>
</div>

<script src="/js/vendor/pixi.min.js"></script>
<script src="/js/vfx-water-tornado.js?v=1.0.1"></script>
<script src="/js/vfx-core.js?v=20260910-water-layers"></script>
<script src="/js/vfx-pixi-backend.js?v=20260910-water-layers"></script>
<script src="/tools/vfx/vfx-semantic-vocab.cjs"></script>
<script src="/tools/vfx/editor/preset-id-policy.js"></script>
<script src="/tools/vfx/editor/view-model.js"></script>
<script src="/tools/vfx/editor/layout-schema.js"></script>
<script src="/tools/vfx/editor/layer-model.js"></script>
<script src="/tools/vfx/editor/curve-model.js"></script>
<script src="/tools/vfx/editor/curve-editor.js"></script>
<script src="/tools/vfx/editor/gradient-model.js"></script>
<script src="/tools/vfx/editor/gradient-editor.js"></script>
<script src="/tools/vfx/editor/gizmo-model.js"></script>
<script src="/tools/vfx/editor/history.js"></script>
<script src="/tools/vfx/editor/spine-ref.js"></script>
<script src="/tools/vfx/editor/editor.js?v=20260910-water-layers"></script>
</body>
</html>
