<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>岩甲術 · 碎岩護甲</title>
<style>body{margin:0;background:#111b23;color:#dfd6c5;font:15px system-ui}main{max-width:1040px;margin:28px auto}h1{font-size:25px;margin-bottom:8px}p{color:#a5b0b8}button,a{background:#2c373d;color:#ecdec4;border:1px solid #6a604c;border-radius:5px;padding:8px 15px;text-decoration:none;cursor:pointer}nav{display:flex;gap:12px;align-items:center;margin:20px 0}canvas{width:100%;border:1px solid #39434a;border-radius:8px}#status{color:#c7ae70;font-size:13px}</style>
<main><h1>岩甲術 · 碎岩護甲</h1><p>六片厚岩甲緩慢環繞，暗金裂縫呼吸，碎石與輕塵維持大地感。</p><nav><button id="pause">暫停</button><button id="restart">重新施放</button><a href="/tools/vfx/editor/?preset=aura-rockarmor-stone" target="_blank">VFX 編輯器</a><span id="status">載入中…</span></nav><div id="view"></div><p>左：放大檢視　／　右：角色比例　　｜　aura-rockarmor-stone.json</p></main>
<script src="/js/vendor/pixi.min.js"></script><script src="/js/vfx-core.js?v=rockarmor1"></script><script src="/js/vfx-pixi-backend.js?v=rockarmor1"></script>
<script>
(async()=>{
 const app=new PIXI.Application();await app.init({width:1040,height:510,background:0x1d2c36,antialias:true,preference:'webgl'});document.getElementById('view').appendChild(app.canvas);
 const grid=new PIXI.Graphics();for(let x=0;x<1040;x+=32)grid.moveTo(x,0).lineTo(x,510);for(let y=0;y<510;y+=32)grid.moveTo(0,y).lineTo(1040,y);grid.stroke({color:0x405362,alpha:.25,width:1});app.stage.addChild(grid);
 const positions=[{x:295,y:350,s:2.5},{x:780,y:315,s:1.25}];
 for(const p of positions){const g=new PIXI.Graphics();g.ellipse(0,0,15,5).fill({color:0x10191d,alpha:.6});g.roundRect(-7,-36,14,32,4).fill(0x638792);g.circle(0,-45,8).fill(0x9cc3ca);g.position.set(p.x,p.y);g.scale.set(p.s);app.stage.addChild(g);}
 const fx=new PIXI.Container();app.stage.addChild(fx);const backend=VFXPixiBackend.createBackend({PIXI,container:fx});
 const [index,preset]=await Promise.all(['/vfx/asset-index.json','/vfx/presets/aura-rockarmor-stone.json'].map(url=>fetch(url,{cache:'no-store'}).then(r=>r.json())));
 const runtime=VFXCore.createRuntime({backend,resolver:VFXCore.createIndexResolver(index,'/images/vfx/assets')});runtime.registerPreset(preset);
 let handles=[],elapsed=0,paused=false;function restart(){handles.forEach(h=>runtime.stop(h));handles=positions.map(p=>runtime.play(preset.id,{position:{x:p.x,y:p.y},scale:p.s,seed:19}));elapsed=0;}restart();
 document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'繼續':'暫停';};document.getElementById('restart').onclick=restart;
 app.ticker.add(ticker=>{if(!paused){const dt=Math.min(.05,ticker.deltaMS/1000);elapsed+=dt;const age=elapsed%6.6;const envelope=Math.min(1,age/.3,Math.max(0,(6.4-age)/.3));handles.forEach((h,i)=>runtime.setTransform(h,{scale:positions[i].s*Math.max(.001,envelope)}));runtime.update(dt);}const errors=backend.takeErrors();document.getElementById('status').textContent=errors.length?JSON.stringify(errors):Math.round(app.ticker.FPS)+' FPS · 共享圖集＋少量塵土';});
})().catch(e=>{document.getElementById('status').textContent=e.stack;console.error(e);});
</script></html>
