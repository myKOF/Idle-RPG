<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>火神星環｜火核與弧形尾焰預覽</title><style>body{margin:0;background:#111b16;color:#e9d9b9;font:16px system-ui;padding:24px}button{background:#46331d;color:#ffe0a2;padding:10px 18px;border:1px solid #af7428;border-radius:5px;margin-right:10px;cursor:pointer}canvas{margin-top:20px;max-width:100%;border:1px solid #52614a}small{color:#bbb}h1{font-size:24px}</style><h1>火神星環 · 實心火核與弧形尾焰</h1><p>半徑 8 米 · 前進 24 米／秒 · 順時針 0.5 圈／秒 · 射程 50 米</p><button data-rate="0">單組飛行</button><button data-rate="3">每秒 3 組</button><button data-rate="10">每秒 10 組壓力預覽</button><p><small>使用遊戲的實際特效程式、貼圖與飛行軌跡。放大 1.5 倍觀察造型。</small></p><div id="view"></div><p id="status">載入中</p><script src="/js/vendor/pixi.min.js"></script><script src="/js/util.js"></script><script src="/js/vfx-core.js?v=20260922-orbit-tail"></script><script src="/js/vfx-pixi-backend.js"></script><script src="/js/vfx-runtime.js?v=20260922-star-orbit-tail"></script><script>
(async()=>{
const app=new PIXI.Application();await app.init({width:975,height:420,background:0x19231b,antialias:true});document.querySelector('#view').append(app.canvas);
const root=new PIXI.Container();root.position.set(150,210);root.scale.set(1.5);app.stage.addChild(root);
const index=await(await fetch('/vfx/shipped-assets.json')).json();const resolver=VFXCore.createIndexResolver(index,'/'+index.baseUrl);
const preset=await(await fetch('/vfx/presets/proj-firehunt-ring.json',{cache:'no-store'})).json();await PIXI.Assets.load([...new Set(preset.layers.map(l=>resolver.resolve(l.assetId)))]);
const backend=VFXPixiBackend.createBackend({container:root,depthSort:true});const rt=VFXRuntime.create({core:VFXCore,resolver,fxBackend:backend,zoneBackend:backend,ctx:{playerPos:()=>({x:0,y:0}),posOf:()=>({x:500,y:0})}});rt.registerPresets([preset]);
let time=0,next=0,rate=0;function volley(){for(let j=0;j<6;j++)rt.tryPlay({fxKind:'projectile',variant:'firehunt-ring',targets:[],hit:false,vfx:{projectile:preset.id},travelMs:[2083],angle:0,lineLength:500,lineWidth:16,area:{flightOrbit:{origin:{x:0,y:0},heading:0,speed:240,length:500,radius:80,phase:-Math.PI/2+j*Math.PI/3,spin:Math.PI}}});}
for(const btn of document.querySelectorAll('button'))btn.onclick=()=>{rt.clear();rate=+btn.dataset.rate;time=0;next=0;};
app.ticker.add(t=>{const dt=Math.min(t.deltaMS/1000,.04);time+=dt;if(time>=next){volley();next+=rate?1/rate:3.2;}rt.update(dt);document.querySelector('#status').textContent='proj-firehunt-ring.json · 飛行彈體 '+rt.stats().projectiles;});
})().catch(e=>document.querySelector('#status').textContent=e.stack);
</script></html>
