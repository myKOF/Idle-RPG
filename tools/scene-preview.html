<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><base href="../"><title>全場景原創改造預覽</title>
<style>body{margin:24px;background:#101613;color:#d7dece;font:15px system-ui}h1{font-size:24px;margin:0 0 8px}p{color:#aebca8}label,button{display:inline-block;margin:6px 12px 6px 0}select,button{padding:8px;background:#263229;color:#e9e8d8;border:1px solid #59654a;border-radius:6px;font:inherit}#host{position:relative;width:920px;height:760px;border:1px solid #657155;max-width:100%;margin-top:12px}canvas{display:block}pre{white-space:pre-wrap;max-width:960px;font-size:12px}.scene-iris{display:none}</style></head>
<body><h1>全場景原創改造</h1><p>正式遊戲渲染器 · 地表／地下 · 局部環境動態。此頁使用獨立角色，不讀取遊戲存檔。</p>
<label>場景 <select id="zone"><option value="desert">荒漠</option><option value="Icefield">冰原</option><option value="swamp">沼澤</option><option value="undead_mountains">亡靈山脈</option><option value="god_battlefield">太古戰場</option><option value="god_chaos">混沌之境</option><option value="god_sanctuary">聖域</option><option value="trial">試煉之塔</option><option value="hell">地獄之塔</option><option value="purgatory">煉獄之塔</option></select></label>
<label>區域 <select id="stage"><option value="1">地表</option><option value="11">地下</option></select></label><label><input id="motion" type="checkbox" checked>播放動態</label><button id="walk">鏡頭前進／返回</button><button id="save" disabled>保存預覽 PNG</button><button id="verify">驗證全場景圖集</button>
<button id="benchmark">測量場景動態成本</button><div id="host"></div><pre id="result">載入中…</pre><pre id="verification"></pre>
<script src="js/vendor/pixi.min.js"></script><script src="js/decor-sculpt.js?v=1.0.0"></script><script src="js/decor-nature.js?v=1.0.6"></script><script src="js/battle-decor.js?v=1.0.16"></script><script src="js/battle-arena.js?v=1.0.5"></script><script src="js/battle-renderer.js?v=1.6.177"></script>
<script>
const zone=document.querySelector('#zone'),stage=document.querySelector('#stage'),result=document.querySelector('#result'),verification=document.querySelector('#verification');
let px=0,ready=false,spawn=1;const delay=ms=>new Promise(r=>setTimeout(r,ms));
function panel(){const tower=['trial','hell','purgatory'].includes(zone.value);const player={hp:100,maxHp:100};const p={gt:performance.now()/1000,stage:{zone:tower?'desert':zone.value,current:+stage.value},field:{playerPos:{x:px,y:0},player,monsters:[]}};if(tower)p.tower={player,playerPos:{x:px,y:0},boss:{name:zone.options[zone.selectedIndex].text,level:50,hp:10000,maxHp:10000,pos:{x:px,y:-120},_spawnAt:spawn,isBoss:true,hell:zone.value==='hell',purgatory:zone.value==='purgatory'}};return p;}
function sync(){if(ready)BattleRenderer.syncBattle(panel());}
zone.onchange=()=>{document.querySelector('#save').disabled=true;spawn++;stage.disabled=['trial','hell','purgatory'].includes(zone.value);sync();};stage.onchange=()=>{document.querySelector('#save').disabled=true;sync();};
document.querySelector('#walk').onclick=()=>{px=px?0:1800;spawn++;sync();};
document.querySelector('#motion').onchange=e=>{const app=BattleRenderer._app();if(e.target.checked)app.start();else app.stop();};
document.querySelector('#benchmark').onclick=async()=>{const app=BattleRenderer._app(),decor=BattleRenderer._decor(),button=document.querySelector('#benchmark');if(!app||!decor)return;button.disabled=true;const fps=app.ticker.maxFPS,wasPlaying=document.querySelector('#motion').checked,rows=[];app.stop();app.ticker.maxFPS=0;let clock=performance.now();try{for(const on of [true,false,true]){decor.setMotionEnabled(on);const samples=[];for(let i=0;i<180;i++){clock+=1000/60;const begin=performance.now();app.ticker.update(clock);const cost=performance.now()-begin;if(i>=30)samples.push(cost);if(i%30===29)await delay(0);}samples.sort((a,b)=>a-b);rows.push({motion:on,frames:150,medianMs:samples[75],p95Ms:samples[142],decor:decor.stats()});verification.textContent=JSON.stringify(rows,null,2);}verification.textContent+='\n僅隔離空場同步CPU提交成本；未量GPU或大量戰鬥技能FPS。';}finally{decor.setMotionEnabled(true);app.ticker.maxFPS=fps;if(wasPlaying)app.start();button.disabled=false;}};
document.querySelector('#save').onclick=async()=>{try{const app=BattleRenderer._app(),c=app.renderer.extract.canvas({target:app.stage,frame:new PIXI.Rectangle(0,0,app.screen.width,app.screen.height),resolution:1});const b=await new Promise(r=>c.toBlob(r));const name=zone.value+(stage.disabled?'':+stage.value===11?'-deep':'-surface')+'.png';if(new URLSearchParams(location.search).has('export')){const response=await fetch('/export/'+name,{method:'POST',body:b});if(!response.ok)throw new Error('PNG保存失敗');verification.textContent='已保存 '+name;}else{const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}}catch(e){verification.textContent=e.stack;}};
document.querySelector('#verify').onclick=async()=>{const worker=new Worker('js/worker/decor-atlas.worker.js?v=1.0.7');let id=0;const rows=[];try{for(const key of Object.keys(BattleDecor.KITS).filter(Boolean))for(const deep of [false,true]){const m=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Worker逾時')),30000);worker.onmessage=e=>{clearTimeout(timer);resolve(e.data);};worker.onerror=e=>{clearTimeout(timer);reject(new Error(e.message));};worker.postMessage({id:++id,kitKey:key,deep});});if(m.error)throw new Error(m.error);let main;const make=document.createElement;try{document.createElement=function(tag){return tag==='canvas'?new OffscreenCanvas(1,1):make.call(document,tag);};main=BattleDecor.buildAtlas(key,deep);}finally{document.createElement=make;}const c=new OffscreenCanvas(m.bitmap.width,m.bitmap.height),g=c.getContext('2d',{willReadFrequently:true});g.drawImage(m.bitmap,0,0);m.bitmap.close();const a=main.canvas.getContext('2d').getImageData(0,0,c.width,c.height).data,b=g.getImageData(0,0,c.width,c.height).data;let maxA=0,maxRGB=0;for(let j=0;j<a.length;j+=4){maxA=Math.max(maxA,Math.abs(a[j+3]-b[j+3]));for(let n=0;n<3;n++)maxRGB=Math.max(maxRGB,Math.abs(a[j+n]*a[j+3]/255-b[j+n]*b[j+3]/255));}if(maxA||maxRGB>2)throw new Error(key+' Worker像素不一致');rows.push(key+(deep?' 地下':' 地表')+' '+c.width+'×'+c.height+' alpha差='+maxA+' 預乘RGB差='+maxRGB.toFixed(3));verification.textContent=rows.join('\n');}verification.textContent+='\n14圖集通過';}catch(e){verification.textContent+='\nFAIL '+e.stack;console.error(e);}finally{worker.terminate();}};
(async()=>{if(!await BattleRenderer.init(document.querySelector('#host')))throw new Error('Renderer未啟動');ready=true;sync();setInterval(()=>{sync();const status=BattleRenderer.status(),tower=stage.disabled;const settled=tower?status.arena.on&&status.arena.tier===zone.value&&!status.scene.phase:status.zone===zone.value&&status.decor.scene===zone.value+(+stage.value===11?'#deep':'')&&status.decor.ready&&status.decor.band===Math.floor((+stage.value-1)/10);
document.querySelector('#save').disabled=!settled;result.textContent=JSON.stringify(status,null,2);},250);})().catch(e=>{result.textContent=e.stack;console.error(e);});
</script></body></html>
